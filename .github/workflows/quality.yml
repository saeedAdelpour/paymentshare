name: Quality
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17.11-alpine@sha256:266d3c257594e195b309ae9d1805e54c788f1d7b375f56bf6c367aac6c917e7b
        env:
          POSTGRES_USER: paymentshare
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: paymentshare_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U paymentshare -d paymentshare_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      TEST_DATABASE_URL: postgres://paymentshare:ci-only@127.0.0.1:5432/paymentshare_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            tools/go.sum
      - name: Report Go toolchain
        run: go version
      - run: make ci
