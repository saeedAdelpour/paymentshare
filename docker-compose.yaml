name: paymentshare-foundation
services:
  postgres:
    image: postgres:17.11-alpine
    ports:
      - 5432:5432
    environment:
      POSTGRES_USER: paymentshare
      POSTGRES_PASSWORD: paymentshare-development-only
      POSTGRES_DB: paymentshare
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./scripts/init-databases.sql:/docker-entrypoint-initdb.d/01-test-database.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paymentshare -d paymentshare"]
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  postgres-data:
